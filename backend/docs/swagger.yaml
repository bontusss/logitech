host: localhost:8080
info:
  contact:
    email: support@logitech.example
    name: Logitech API Support
    url: https://github.com/bontusss/logitech
  description: |-
    Shipment management API for Logitech: staff record the items a customer brings in with the payment taken and any balance, the destination branch receives them or raises an exception, and the owner sees shipments, revenue, daily collections and outstanding balances.

    ## Demo / Seed Credentials

    Every seeded staff account uses PIN `demo1234`. Use `POST /api/auth/login` with `staff_id` + `pin`.

    | Staff ID | Full Name       | Role    | Job Role   | Branch | PIN      |
    |----------|-----------------|---------|------------|--------|----------|
    | GAL-001  | Chinedu Okafor  | owner   | —          | Lagos  | demo1234 |
    | GAL-002  | Ada Nwosu       | manager | —          | Lagos  | demo1234 |
    | GAL-003  | Tunde Bello     | staff   | operations | Lagos  | demo1234 |
    | GAL-004  | Mary James      | staff   | receiving  | Abuja  | demo1234 |
    | GAL-005  | Halima Bello    | manager | —          | Abuja  | demo1234 |
    | GAL-006  | Ifeoma Nnaji    | staff   | receiving  | Ibadan | demo1234 |
    | GAL-007  | Suleiman Audu   | staff   | operations | Abuja  | demo1234 |

    ### System Admin
    Use `POST /api/auth/admin/login` with:

    | Field    | Value             |
    |----------|-------------------|
    | username | admin             |
    | password | adminpassword123  |

    The system admin can also log in via the unified `POST /api/auth/login` endpoint by sending `staff_id: "admin"` (or the admin username) together with `password` instead of `pin`.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Logitech API
  version: "1.0"
paths:
  /api/auth/admin/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate as system administrator using credentials configured in environment.

        ### Demo credentials

        | Field    | Value            |
        |----------|------------------|
        | username | admin            |
        | password | adminpassword123 |
      parameters:
      - description: Admin Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: System Admin Login
      tags:
      - auth
  /api/auth/change-pin:
    post:
      consumes:
      - application/json
      parameters:
      - description: Current and new PIN
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change the authenticated user's PIN
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate a staff member using their `staff_id` and `pin`.

        ### Normal login (PIN already set)
        Send `staff_id` + `pin` only.

        ### First login / after a PIN reset
        1. Call this endpoint with `staff_id` + `pin` (the one-time password).
        The API responds 400 with `"provide new_pin"` in the error message.
        2. Call again with `staff_id` + `pin` (OTP) + `new_pin` (4-10 chars).
        The OTP is consumed; `new_pin` becomes the permanent PIN.

        Account locks after **3** failed attempts; a branch manager or owner must unlock it.

        ---
        ### Seed / demo credentials (PIN = `demo1234` for all)

        | staff_id | Full name      | Role    |
        |----------|----------------|---------|
        | GAL-001  | Chinedu Okafor | owner   |
        | GAL-002  | Ada Nwosu      | manager |
        | GAL-003  | Tunde Bello    | staff   |
        | GAL-004  | Mary James     | staff   |

        GAL-014 and GAL-015 have `first_login_done = false` (first-login flow required).
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Staff Login
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Invalidate the current session token using Redis token revocation.
      produces:
      - application/json
