host: localhost:8080
info:
  contact:
    email: support@logitech.example
    name: Logitech API Support
    url: https://github.com/bontusss/logitech
  description: |-
    Logistics and Manifest Management API for Logitech.

    ## Demo / Seed Credentials

    All seeded staff accounts use PIN `demo1234`. Use `POST /api/auth/login` with `staff_id` + `pin`.

    | Staff ID | Full Name      | Role    | Job Role   | PIN      |
    |----------|----------------|---------|------------|----------|
    | GAL-001  | Chinedu Okafor | owner   | —          | demo1234 |
    | GAL-002  | Ada Nwosu      | manager | —          | demo1234 |
    | GAL-003  | Tunde Bello    | staff   | operations | demo1234 |
    | GAL-004  | Mary James     | staff   | receiving  | demo1234 |

    **GAL-014** and **GAL-015** have `first_login_done = false` — they still need an OTP + new PIN (use `POST /api/staff/:id/reset-pin` as an owner/admin to obtain a fresh OTP).

    ### System Admin
    Use `POST /api/auth/admin/login` with:

    | Field    | Value             |
    |----------|-------------------|
    | username | admin             |
    | password | adminpassword123  |

    The system admin can also log in via the unified `POST /api/auth/login` endpoint by sending `staff_id: "admin"` (or the admin username) together with `password` instead of `pin`.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Logitech API
  version: "1.0"
paths:
  /api/auth/admin/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate as system administrator using credentials configured in environment.

        ### Demo credentials

        | Field    | Value            |
        |----------|------------------|
        | username | admin            |
        | password | adminpassword123 |
      parameters:
      - description: Admin Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: System Admin Login
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate a staff member using their `staff_id` and `pin`.

        ### Normal login (PIN already set)
        Send `staff_id` + `pin` only.

        ### First login / after a PIN reset
        1. Call this endpoint with `staff_id` + `pin` (the one-time password).
        The API responds 400 with `"provide new_pin"` in the error message.
        2. Call again with `staff_id` + `pin` (OTP) + `new_pin` (4-10 chars).
        The OTP is consumed; `new_pin` becomes the permanent PIN.

        Account locks after **3** failed attempts; a branch manager or owner must unlock it.

        ---
        ### Seed / demo credentials (PIN = `demo1234` for all)

        | staff_id | Full name      | Role    |
        |----------|----------------|---------|
        | GAL-001  | Chinedu Okafor | owner   |
        | GAL-002  | Ada Nwosu      | manager |
        | GAL-003  | Tunde Bello    | staff   |
        | GAL-004  | Mary James     | staff   |

        GAL-014 and GAL-015 have `first_login_done = false` (first-login flow required).
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Staff Login
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Invalidate the current session token using Redis token revocation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User Logout
      tags:
      - auth
  /api/auth/me:
    get:
      description: Returns the profile and role details of the currently authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StaffProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Current Authenticated User Profile
      tags:
      - auth
  /api/branches:
    get:
      description: Retrieve a list of all branches.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.BranchResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List All Branches
      tags:
      - branches
    post:
      consumes:
      - application/json
      description: Creates a new branch. Only the owner (or system admin) can manage
        branches.
      parameters:
      - description: Branch Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateBranchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.BranchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a branch
      tags:
      - branches
  /api/branches/{id}:
    delete:
      description: Marks a branch inactive (soft delete, its data is retained). Only
        the owner (or system admin) can manage branches.
      parameters:
      - description: Branch UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BranchResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a branch
      tags:
      - branches
    put:
      consumes:
      - application/json
      description: Updates branch details. Only the owner (or system admin) can manage
        branches.
      parameters:
      - description: Branch UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateBranchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BranchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a branch
      tags:
      - branches
  /api/drivers:
    get:
      description: Retrieve a list of all drivers.
      produces:
