  /api/records:
    get:
      description: 'Lists shipment records newest first with the amount billed, the
        amount paid and the remaining balance. Owners and the system admin see every
        branch; managers and staff see records that originate from or are destined
        to their own branch. Optional filters: free text (tracking number, serial
        number, description, sender/receiver name or phone), status, payment_status,
        branch_id (origin or destination), origin_branch_id, destination_branch_id,
        from/to dates (created_at), and outstanding=true for records with a balance.'
      parameters:
      - description: Tracking number, serial number, description, party name or phone
        in: query
        name: q
        type: string
      - description: 'comma-separated: pending,in_transit,received,exception,cancelled'
        in: query
        name: status
        type: string
      - description: pending, partial or paid
        in: query
        name: payment_status
        type: string
      - description: Branch UUID (origin or destination)
        in: query
        name: branch_id
        type: string
      - description: Origin branch UUID
        in: query
        name: origin_branch_id
        type: string
      - description: Destination branch UUID
        in: query
        name: destination_branch_id
        type: string
      - description: Created on or after (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Created on or before (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Only records with an unpaid balance
        in: query
        name: outstanding
        type: boolean
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.Record'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List shipment records
      tags:
      - records
    post:
      consumes:
      - application/json
      description: 'The sender-side flow: a staff member records the item(s) a customer
        brings in, the destination branch, the amount charged and the payment taken
        at the counter. Any unpaid remainder becomes the record''s balance. Senders
        and receivers are matched on phone number, or created when they are new. When
        origin_branch_id is omitted the staff member''s own branch is used.'
      parameters:
      - description: Shipment items
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateRecordRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/handler.Record'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Record one or more shipments
      tags:
      - records
  /api/records/{id}:
    get:
      description: Returns one record with its payment history and any exceptions
        raised against it.
      parameters:
      - description: Record UUID
        in: path
        name: id
        required: true
        type: string
      produces:
