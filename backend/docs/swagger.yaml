      tags:
      - records
  /api/records/{id}/exceptions:
    get:
      parameters:
      - description: Record UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ExceptionResponse'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the exceptions of a record
      tags:
      - exceptions
    post:
      consumes:
      - application/json
      description: 'The receiver-specific alternative to receiving cleanly: records
        what went wrong (missing, damaged, quantity mismatch, wrong goods ...) and
        flags the shipment as "exception". Defaults to the destination branch, or
        the origin branch when the sender raises it before dispatch.'
      parameters:
      - description: Record UUID
        in: path
        name: id
        required: true
        type: string
      - description: Exception details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateExceptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.ExceptionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Raise an exception on a record
      tags:
      - exceptions
  /api/records/{id}/payments:
    get:
      description: Returns every payment recorded against a shipment, oldest first.
      parameters:
      - description: Record UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.RecordPaymentResponse'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the payments of a record
      tags:
      - records
    post:
      consumes:
      - application/json
      description: Adds a payment for a shipment (at the counter or when the balance
        is collected at the destination branch) and returns the record with the updated
        amount paid and remaining balance. A payment can never exceed the outstanding
        balance.
      parameters:
      - description: Record UUID
        in: path
        name: id
        required: true
        type: string
      - description: Payment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RecordPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Record'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Record a payment against a record
      tags:
      - records
  /api/records/{id}/receive:
    post:
      consumes:
      - application/json
      description: 'The receiver-side flow: staff at the destination branch confirm
        the quantity and condition actually received. Any remaining balance can be
        collected in the same call by sending a payment, which updates the balance
        and payment status. The record becomes "received"; use POST /api/records/:id/exceptions
        instead when goods are missing, damaged or wrong.'
      parameters:
      - description: Record UUID
        in: path
        name: id
        required: true
        type: string
      - description: Receipt details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ReceiveRecordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Record'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Receive a record at the destination branch
      tags:
      - records
  /api/reports/branches:
    get:
      description: Shipments sent and received, amounts billed, payments collected,
        unpaid balances and open exceptions for every branch. The owner sees all branches;
        a manager sees only their own.
      parameters:
      - description: Start date (YYYY-MM-DD), default 29 days ago
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD), default today
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.BranchReportRow'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Per-branch performance
      tags:
      - reports
  /api/reports/daily:
    get:
      description: 'One row per day in the period: how many shipments were recorded,
        how much was billed, how many payments were taken and how much was collected.
        The owner sees all branches; a manager sees their own branch.'
      parameters:
      - description: Start date (YYYY-MM-DD), default 29 days ago
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD), default today
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.DailyReportRow'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Daily shipments and collections
      tags:
      - reports
  /api/reports/overview:
    get:
      description: 'Totals for the selected period (default: the last 30 days). The
        owner and system admin see every branch; a manager sees their own branch.
        "billed" is what was charged on records created in the period, "collected"
        is the payments taken in the period, and "outstanding" is the unpaid balance
        on all live records, plus today''s collections and the exception backlog.'
      parameters:
      - description: Start date (YYYY-MM-DD), default 29 days ago
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD), default today
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ReportOverview'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 'Owner dashboard: shipments, revenue, collections, balances, exceptions'
      tags:
      - reports
  /api/staff:
    get:
      description: |-
        Retrieve a list of staff members. Accessible by system_admin, owner, and manager.
        Managers are always limited to the staff of their own assigned branch.
      parameters:
      - description: Filter by Branch UUID
        in: query
        name: branch_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.StaffProfile'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Staff Members
      tags:
      - staff
    post:
      consumes:
      - application/json
      description: |-
        Creates a staff member (role: staff) with a required job_role: operations, dispatch or receiving. Accessible to owners and managers only.
        - Managers can only create staff in their own branch (branch_id is forced from their token).
        - Owners can create staff in any branch.
        A staff_id (e.g. GAL-001, prefix configurable via STAFF_ID_PREFIX) is auto-generated, and a one-time password is returned once so the user can log in and choose their personal PIN (max 10 chars).
      parameters:
      - description: Staff Creation Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateStaffRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateStaffResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a staff member
      tags:
      - staff
  /api/staff/{id}:
    delete:
      description: Revokes a user's access by marking their account inactive. Managers
        can revoke staff in their own branch; the owner can revoke anyone.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StaffProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke staff access
      tags:
      - staff
    get:
      description: Get details for a specific staff member by UUID. Staff can only
        fetch their own profile; managers only staff in their own branch.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StaffProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Staff Details
      tags:
      - staff
    put:
      consumes:
      - application/json
      description: Update a staff member's details. Managers can only update staff
        in their own branch; the owner can update anyone. Changing status (e.g. re-activating
        a revoked account) is owner/system admin only.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateStaffRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StaffProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update staff details
      tags:
      - staff
  /api/staff/{id}/first-login:
    get:
      description: Reports whether the staff has completed their first login (i.e.
        created their personal PIN), and when. Staff can query their own status; managers
        only staff in their own branch; the owner can query anyone.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.FirstLoginStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Check if a staff has performed their first login
      tags:
      - staff
  /api/staff/{id}/reset-pin:
    post:
      description: |-
        Generates a new one-time password for the user, invalidating their current PIN. The one-time password is returned once and must be given to the user, who uses it at login (with new_pin) to choose a new PIN. Any lockout on the account is cleared.
        Managers can reset the PIN of staff in their own branch; the owner can reset any PIN.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ResetStaffPinResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reset a staff PIN
      tags:
      - staff
  /api/staff/{id}/unlock:
    post:
      description: Removes the lockout from an account that was locked after 3 failed
        login attempts. Managers can unlock staff of their own branch; the owner can
        unlock accounts across all branches.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StaffProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unlock a locked account
      tags:
      - staff
  /health:
    get:
      description: Returns the service status and PostgreSQL database connection state.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Check service health
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
