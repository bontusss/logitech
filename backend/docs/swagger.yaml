      description: Retrieve a list of all fleet vehicles.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.FleetResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List All Fleet Vehicles
      tags:
      - fleet
    post:
      consumes:
      - application/json
      description: Creates a new fleet vehicle. Only the owner (or system admin) can
        manage fleet.
      parameters:
      - description: Fleet Vehicle Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateFleetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.FleetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a Fleet Vehicle
      tags:
      - fleet
  /api/fleet/{id}:
    delete:
      description: Marks a fleet vehicle inactive (soft delete, its data is retained).
        Only the owner (or system admin) can manage fleet.
      parameters:
      - description: Fleet UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.FleetResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a Fleet Vehicle
      tags:
      - fleet
    put:
      consumes:
      - application/json
      description: Updates fleet vehicle details. Only the owner (or system admin)
        can manage fleet.
      parameters:
      - description: Fleet UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateFleetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.FleetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a Fleet Vehicle
      tags:
      - fleet
  /api/hello:
    get:
      description: Returns a simple greeting message from the Logitech API server.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HelloResponse'
      summary: Hello message
      tags:
      - example
  /api/managers:
    get:
      description: Retrieve a list of manager accounts. Accessible by the owner (and
        system admin), optionally filtered by branch.
      parameters:
      - description: Filter by Branch UUID
        in: query
        name: branch_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.StaffProfile'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List manager accounts
      tags:
      - managers
    post:
      consumes:
      - application/json
      description: Creates a manager account for a branch. Only the owner (or system
        admin) can manage managers. A staff_id is auto-generated and a one-time password
        is returned once, to be given to the manager for their first login.
      parameters:
      - description: Manager Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a manager account
      tags:
      - managers
  /api/manifests:
    get:
      description: Returns recent manifests with their item counts, newest first.
        Staff only ever see manifests they created; managers, owners and the system
        admin see everyone's. Optionally filter by creator (a staff UUID, or "me")
        and by statuses (comma-separated).
      parameters:
      - description: staff UUID, or me
        in: query
        name: created_by
        type: string
      - description: comma-separated manifest statuses, e.g. draft,review_required
        in: query
        name: statuses
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ManifestSummary'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List manifests
      tags:
      - manifests
    post:
      consumes:
      - application/json
      description: Creates a manifest and all of its items in one transaction. When
        manifest_number is omitted the server generates a unique 5-digit number. When
        destination_branch_id (the "to" branch) is given, every item is stored with
        that destination; otherwise each item needs its own destination_branch_id.
        Sender and receiver customers are matched by phone or created on the fly.
      parameters:
      - description: Manifest with items
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateManifestPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateManifestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a manifest with its items
      tags:
      - manifests
  /api/owners:
    post:
      consumes:
      - application/json
      description: Creates an owner account. Only the system admin can create owners.
        A staff_id is auto-generated and a one-time password is returned once, to
        be given to the owner for their first login.
      parameters:
      - description: Owner Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an owner account
      tags:
      - owners
  /api/photos:
    post:
      consumes:
      - multipart/form-data
      description: Saves a captured image into the `photos` folder at the project
        root.
      parameters:
      - description: Captured photo
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PhotoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a photo taken with the camera
      tags:
      - photos
  /api/staff:
    get:
      description: |-
        Retrieve a list of staff members. Accessible by system_admin, owner, and manager.
        Managers are always limited to the staff of their own assigned branch.
      parameters:
      - description: Filter by Branch UUID
        in: query
        name: branch_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.StaffProfile'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Staff Members
      tags:
      - staff
    post:
      consumes:
      - application/json
      description: |-
        Creates a staff member (role: staff) with a required job_role: operations, dispatch or receiving. Accessible to owners and managers only.
        - Managers can only create staff in their own branch (branch_id is forced from their token).
        - Owners can create staff in any branch.
        A staff_id (e.g. GAL-001, prefix configurable via STAFF_ID_PREFIX) is auto-generated, and a one-time password is returned once so the user can log in and choose their personal PIN (max 10 chars).
      parameters:
      - description: Staff Creation Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateStaffRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateStaffResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a staff member
      tags:
      - staff
  /api/staff/{id}:
    delete:
      description: Revokes a user's access by marking their account inactive. Managers
        can revoke staff in their own branch; the owner can revoke anyone.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StaffProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke staff access
      tags:
      - staff
    get:
      description: Get details for a specific staff member by UUID. Staff can only
        fetch their own profile; managers only staff in their own branch.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StaffProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Staff Details
      tags:
      - staff
    put:
      consumes:
      - application/json
      description: Update a staff member's details. Managers can only update staff
        in their own branch; the owner can update anyone. Changing status (e.g. re-activating
        a revoked account) is owner/system admin only.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateStaffRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StaffProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update staff details
      tags:
      - staff
  /api/staff/{id}/first-login:
    get:
      description: Reports whether the staff has completed their first login (i.e.
        created their personal PIN), and when. Staff can query their own status; managers
        only staff in their own branch; the owner can query anyone.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.FirstLoginStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Check if a staff has performed their first login
      tags:
      - staff
  /api/staff/{id}/reset-pin:
    post:
      description: |-
        Generates a new one-time password for the user, invalidating their current PIN. The one-time password is returned once and must be given to the user, who uses it at login (with new_pin) to choose a new PIN. Any lockout on the account is cleared.
        Managers can reset the PIN of staff in their own branch; the owner can reset any PIN.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ResetStaffPinResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reset a staff PIN
      tags:
      - staff
  /api/staff/{id}/unlock:
    post:
      description: Removes the lockout from an account that was locked after 3 failed
        login attempts. Managers can unlock staff of their own branch; the owner can
        unlock accounts across all branches.
      parameters:
      - description: Staff UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StaffProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unlock a locked account
      tags:
      - staff
  /health:
    get:
      description: Returns the service status and PostgreSQL database connection state.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Check service health
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
