info:
  name: System Admin Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/auth/admin/login"
  body:
    type: json
    data: |-
      { 
        "password": "adminpassword123",
        "username": "admin"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.body;
        bru.setEnvVar("token", body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

