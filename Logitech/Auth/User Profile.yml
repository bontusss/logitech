info:
  name: User Profile
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/auth/me"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: sys admin profile example
    request:
      url: "{{url}}/api/auth/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: date
          value: Thu, 22 Oct 2026 21:38:20 GMT
        - name: content-length
          value: "184"
      body:
        type: json
        data: |-
          {
            "id": "admin",
            "staff_id": "SYS-ADMIN",
            "full_name": "System Administrator",
            "role": "system_admin",
            "email": "admin@logitech.example",
            "status": "active",
            "first_login_done": true,
            "locked": false
          }
