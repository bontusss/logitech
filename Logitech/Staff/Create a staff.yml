info:
  name: Create a staff
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/staff"
  body:
    type: json
    data: |-
      {
        "branch_id": "11111111-1111-4111-8111-111111111111",
        "email": "staff1@logitech.example",
        "full_name": "Tunde Bello",
        "job_role": "operations",
        "phone": "08031110002"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
