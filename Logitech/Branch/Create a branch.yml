      body:
        type: json
        data: |-
          {
            "address": "5 Zoo Road",
            "code": "KAN-01",
            "name": "Kano Branch",
            "phone": "08030000004",
            "state": "Kano"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
        - name: date
          value: Thu, 22 Oct 2026 21:41:44 GMT
        - name: content-length
          value: "196"
      body:
        type: json
        data: |-
          {
