info:
  name: Create a branch
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/branches"
  body:
    type: json
    data: |-
      {
        "address": "5 Zoo Road",
        "code": "KAN-01",
        "name": "Kano Branch",
        "phone": "08030000004",
        "state": "Kano"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
